name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["22.18.0", "24"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      # The extension has no runtime dependencies; the install only brings in the
      # host-provided types and typescript for the type check.
      - run: npm install --no-audit --no-fund

      - run: npx tsc --noEmit

      - run: node --experimental-strip-types --test tests/extension.test.ts
